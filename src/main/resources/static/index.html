<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Complaint Management System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 20px;
            font-size: 1.8em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        /* ===== TABS ===== */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tab-btn {
            padding: 8px 18px;
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: white;
            transition: all 0.3s;
            backdrop-filter: blur(5px);
        }

        .tab-btn:hover {
            background: rgba(255,255,255,0.35);
            transform: translateY(-1px);
        }

        .tab-btn.active {
            background: white;
            color: #667eea;
            border-color: white;
        }

        /* ===== CARD (Main Content Box) ===== */
        .tab-content {
            display: none;
            background: white;
            padding: 25px 30px;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            max-width: 520px;
            margin: 0 auto;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        /* Wide tabs (complaints table ke liye) */
        .tab-content.wide {
            max-width: 950px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== FORM HEADING ===== */
        .tab-content h2 {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 18px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }

        /* ===== FORM GRID (2 columns) ===== */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-grid .full-width {
            grid-column: 1 / -1;
        }

        /* ===== FORM GROUP ===== */
        .form-group {
            margin-bottom: 0;
        }

        label {
            display: block;
            margin-bottom: 4px;
            font-weight: 600;
            color: #555;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select, textarea {
            width: 100%;
            padding: 9px 12px;
            border: 1.5px solid #e0e0e0;
            border-radius: 8px;
            font-size: 13px;
            transition: all 0.2s;
            background: #fafafa;
            color: #333;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* ===== SUBMIT BUTTON ===== */
        button[type="submit"] {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 11px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: all 0.3s;
            letter-spacing: 0.5px;
        }

        button[type="submit"]:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }

        /* ===== MESSAGE ===== */
        .message {
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
            font-size: 13px;
            font-weight: 500;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border-left: 4px solid #28a745;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid #dc3545;
        }

        /* ===== TABLE ===== */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 13px;
        }

        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
        }

        th {
            background: #f8f9fa;
            font-weight: 700;
            color: #444;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        tr:hover td {
            background: #fafbff;
        }

        /* ===== STATUS BADGE ===== */
        .status-badge {
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-open { background: #fff3cd; color: #856404; }
        .status-in_progress { background: #cff4fc; color: #055160; }
        .status-resolved { background: #d1e7dd; color: #0a3622; }
        .status-closed { background: #e2e3e5; color: #41464b; }

        /* ===== ACTION BUTTON ===== */
        .action-btn {
            padding: 5px 10px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }

        /* ===== USER INFO BAR ===== */
        .user-info {
            background: linear-gradient(135deg, #f8f9ff, #eef1ff);
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 13px;
            border-left: 4px solid #667eea;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* ===== LOGOUT BUTTON ===== */
        .logout-btn {
            background: #dc3545;
            color: white;
            padding: 6px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }

        .logout-btn:hover {
            background: #c82333;
        }

        /* ===== SELECT in TABLE ===== */
        table select {
            padding: 5px 8px;
            font-size: 12px;
            border-radius: 5px;
            border: 1.5px solid #dee2e6;
            background: white;
            cursor: pointer;
        }

        /* ===== DELETE BUTTON in TABLE ===== */
        .delete-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }

        .delete-btn:hover {
            background: #c82333;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .tab-content {
                padding: 20px 15px;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
            h1 {
                font-size: 1.4em;
            }
        }
        /* ===== PASSWORD EYE ICON ===== */
.password-wrapper {
    position: relative;
    display: flex;
    align-items: center;
}

.password-wrapper input {
    padding-right: 40px;
}

.eye-icon {
    position: absolute;
    right: 10px;
    cursor: pointer;
    color: #888;
    font-size: 16px;
    user-select: none;
    transition: color 0.2s;
}

.eye-icon:hover {
    color: #667eea;
}
    </style>
</head>
<body>
<div class="container">
    <h1>🎯 Smart Complaint Management System</h1>

    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('register')">Register</button>
        <button class="tab-btn" onclick="openTab('login')">Login</button>
        <button class="tab-btn" onclick="openTab('createComplaint')" id="createTab" style="display:none;">Create Complaint</button>
        <button class="tab-btn" onclick="openTab('myComplaints')" id="myTab" style="display:none;">My Complaints</button>
        <button class="tab-btn" onclick="openTab('adminPanel')" id="adminTab" style="display:none;">Admin Panel</button>
    </div>

    <!-- Register Tab -->
    <!-- Register Tab -->
    <div id="register" class="tab-content active">
        <h2>👤 User Registration</h2>
        <div id="registerMsg" class="message"></div>
        <form onsubmit="registerUser(event)">
            <div class="form-grid">
                <div class="form-group">
                    <label>Username *</label>
                    <input type="text" id="regUsername" placeholder="Enter username" required>
                </div>
                <div class="form-group">
                    <label>Password *</label>
                    <div class="password-wrapper">
                        <input type="password" id="regPassword" placeholder="Enter password" required>
                        <span class="eye-icon" onclick="togglePassword('regPassword', this)">👁️</span>
                    </div>
                </div>
                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text" id="regFullName" placeholder="Enter full name" required>
                </div>
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" id="regEmail" placeholder="Enter email" required>
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="tel" id="regPhone" placeholder="Enter phone">
                </div>
                <div class="form-group">
                    <label>Role *</label>
                    <select id="regRole" required onchange="toggleCompanyCode()">
                        <option value="CUSTOMER">Customer</option>
                        <option value="ADMIN">Admin</option>
                        <option value="SUPPORT_AGENT">Support Agent</option>
                    </select>
                </div>
                <div class="form-group full-width" id="companyCodeGroup" style="display:none;">
                    <label>Company Verification Code *</label>
                    <input type="text" id="regCompanyCode" placeholder="Enter admin company code">
                </div>
            </div>
            <button type="submit">Register</button>
        </form>
    </div>

    <!-- Login Tab -->
    <!-- Login Tab -->
    <div id="login" class="tab-content">
        <h2>🔐 Login</h2>
        <div id="loginMsg" class="message"></div>
        <form onsubmit="loginUser(event)">
            <div class="form-group" style="margin-bottom: 12px;">
                <label>Username *</label>
                <input type="text" id="loginUsername" placeholder="Enter your username" required>
            </div>
            <div class="form-group" style="margin-bottom: 12px;">
                <label>Password *</label>
                <div class="password-wrapper">
                    <input type="password" id="loginPassword" placeholder="Enter your password" required>
                    <span class="eye-icon" onclick="togglePassword('loginPassword', this)">👁️</span>
                </div>
            </div>
            <button type="submit">Login</button>
        </form>
    </div>

    <!-- Create Complaint Tab -->
    <div id="createComplaint" class="tab-content">
        <div class="user-info" id="userInfo"></div>
        <h2>Create New Complaint</h2>
        <div id="complaintMsg" class="message"></div>
        <form onsubmit="createComplaint(event)">
            <div class="form-group">
                <label>Title *</label>
                <input type="text" id="complaintTitle" required>
            </div>
            <div class="form-group">
                <label>Description *</label>
                <textarea id="complaintDesc" required></textarea>
            </div>
            <button type="submit">Submit Complaint</button>
        </form>
    </div>

    <!-- My Complaints Tab -->
    <div id="myComplaints" class="tab-content wide">
        <div class="user-info" id="userInfo2"></div>
        <h2>My Complaints</h2>
        <div id="myComplaintsTable"></div>
    </div>

    <!-- Admin Panel Tab -->
    <div id="adminPanel" class="tab-content wide">
        <div class="user-info" id="userInfo3"></div>
        <h2>Admin Panel</h2>
        <div id="adminTable"></div>
    </div>
</div>

<script>
    let currentUser = null;
// Password Show/Hide Toggle
function togglePassword(inputId, iconElement) {
    const input = document.getElementById(inputId);
    if (input.type === 'password') {
        input.type = 'text';
        iconElement.textContent = '🙈'; // Hide icon
    } else {
        input.type = 'password';
        iconElement.textContent = '👁️'; // Show icon
    }
}
    function openTab(tabName) {
        const tabs = document.querySelectorAll('.tab-content');
        const btns = document.querySelectorAll('.tab-btn');

        tabs.forEach(tab => tab.classList.remove('active'));
        btns.forEach(btn => btn.classList.remove('active'));

        document.getElementById(tabName).classList.add('active');
        event.target.classList.add('active');

        if (tabName === 'myComplaints') loadMyComplaints();
        if (tabName === 'adminPanel') loadAdminPanel();
    }
// Admin select karne par Company Code box dikhane/chupane ke liye
function toggleCompanyCode() {
    const role = document.getElementById('regRole').value;
    const codeGroup = document.getElementById('companyCodeGroup');
    if (role === 'ADMIN') {
        codeGroup.style.display = 'block';
        document.getElementById('regCompanyCode').required = true;
    } else {
        codeGroup.style.display = 'none';
        document.getElementById('regCompanyCode').required = false;
    }
}
async function registerUser(e) {
    e.preventDefault();
    const data = {
        username: document.getElementById('regUsername').value,
        password: document.getElementById('regPassword').value,
        fullName: document.getElementById('regFullName').value,
        email: document.getElementById('regEmail').value,
        phone: document.getElementById('regPhone').value,
        role: document.getElementById('regRole').value,
        companyCode: document.getElementById('regCompanyCode').value
    };

    try {
        const response = await fetch('/api/users/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        const result = await response.json();

        if (result.success) {
            showMessage('registerMsg', 'Registration Successful! Redirecting to Login...', 'success');
            e.target.reset();
            // 2 second baad login tab par le jayega
            setTimeout(() => {
                openTab('login');
            }, 2000);
        } else {
            showMessage('registerMsg', result.message, 'error');
        }
    } catch (error) {
        showMessage('registerMsg', 'Error: ' + error.message, 'error');
    }
}F

    async function loginUser(e) {
        e.preventDefault();
        const data = {
            username: document.getElementById('loginUsername').value,
            password: document.getElementById('loginPassword').value
        };

        try {
            const response = await fetch('/api/users/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await response.json();

            if (result.success) {
                currentUser = result.data;
                showUserTabs();
                updateUserInfo();
                openTab('createComplaint');
            }
            showMessage('loginMsg', result.message, result.success ? 'success' : 'error');
        } catch (error) {
            showMessage('loginMsg', 'Error: ' + error.message, 'error');
        }
    }

    async function createComplaint(e) {
        e.preventDefault();
        const data = {
            title: document.getElementById('complaintTitle').value,
            description: document.getElementById('complaintDesc').value,
            customerId: currentUser.id
        };

        try {
            const response = await fetch('/api/complaints', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await response.json();

            showMessage('complaintMsg', result.message, result.success ? 'success' : 'error');
            if (result.success) e.target.reset();
        } catch (error) {
            showMessage('complaintMsg', 'Error: ' + error.message, 'error');
        }
    }

    async function loadMyComplaints() {
        try {
            const response = await fetch(`/api/complaints/customer/${currentUser.id}`);
            const result = await response.json();

            if (result.success && result.data.length > 0) {
                let html = '<table><tr><th>ID</th><th>Title</th><th>Status</th><th>Created</th></tr>';
                result.data.forEach(c => {
                    html += `<tr>
                        <td>${c.id}</td>
                        <td>${c.title}</td>
                        <td><span class="status-badge status-${c.status.toLowerCase()}">${c.status}</span></td>
                        <td>${new Date(c.createdAt).toLocaleDateString()}</td>
                    </tr>`;
                });
                html += '</table>';
                document.getElementById('myComplaintsTable').innerHTML = html;
            } else {
                document.getElementById('myComplaintsTable').innerHTML = '<p>No complaints found.</p>';
            }
        } catch (error) {
            document.getElementById('myComplaintsTable').innerHTML = '<p>Error loading.</p>';
        }
    }

    async function loadAdminPanel() {
    try {
        const [cRes, aRes] = await Promise.all([
            fetch('/api/complaints'),
            fetch('/api/users/agents')
        ]);

        const complaints = await cRes.json();
        const agents = await aRes.json();

        if (complaints.success) {
            let html = '<table><tr><th>ID</th><th>Title</th><th>Customer</th><th>Status</th><th>Assign</th><th>Action</th></tr>';
            complaints.data.forEach(c => {
                html += `<tr>
                    <td>${c.id}</td>
                    <td>${c.title}</td>
                    <td>${c.customer.fullName}</td>
                    <td><span class="status-badge status-${c.status.toLowerCase()}">${c.status}</span></td>
                    <td>
                        <select onchange="assignAgent(${c.id}, this.value)">
                            <option value="">Select Agent</option>
                            ${agents.data.map(a => `<option value="${a.id}">${a.fullName}</option>`).join('')}
                        </select>
                    </td>
                    <td>
                        <button onclick="confirmDelete(${c.id})" style="background:#dc3545; color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer;">Delete</button>
                    </td>
                </tr>`;
            });
            html += '</table>';
            document.getElementById('adminTable').innerHTML = html;
        }
    } catch (error) {
        document.getElementById('adminTable').innerHTML = '<p>Error loading data.</p>';
    }
}

async function confirmDelete(id) {
    if (confirm("Are you sure you want to delete this complaint?")) {
        try {
            const response = await fetch(`/api/admin/complaints/${id}`, {
                method: 'DELETE'
            });
            const result = await response.json();
            if (result.success) {
                alert("Complaint deleted successfully!");
                loadAdminPanel(); // List ko refresh karega
            } else {
                alert(result.message);
            }
        } catch (error) {
            alert("Error deleting: " + error.message);
        }
    }
}
    async function assignAgent(complaintId, agentId) {
        if (!agentId) return;

        try {
            const response = await fetch(`/api/admin/complaints/${complaintId}/assign/${agentId}`, {
                method: 'PUT'
            });
            const result = await response.json();
            alert(result.message);
            if (result.success) loadAdminPanel();
        } catch (error) {
            alert('Error: ' + error.message);
        }
    }

    function showMessage(id, text, type) {
        const msg = document.getElementById(id);
        msg.textContent = text;
        msg.className = `message ${type}`;
        msg.style.display = 'block';
        setTimeout(() => msg.style.display = 'none', 5000);
    }

function showUserTabs() {
    // ✅ Register aur Login tabs HIDE karo
    document.querySelectorAll('.tab-btn').forEach(btn => {
        if (btn.textContent.trim() === 'Register' ||
            btn.textContent.trim() === 'Login') {
            btn.style.display = 'none';
        }
    });

    // ✅ User ke role ke hisab se tabs SHOW karo
    document.getElementById('createTab').style.display = 'block';
    document.getElementById('myTab').style.display = 'block';

    if (currentUser.role === 'ADMIN') {
        document.getElementById('adminTab').style.display = 'block';
        document.getElementById('allComplaintsTab').style.display = 'block';
    }

    if (currentUser.role === 'SUPPORT_AGENT') {
        document.getElementById('allComplaintsTab').style.display = 'block';
    }
}

    function updateUserInfo() {
        const info = `<strong>Logged in:</strong> ${currentUser.fullName} (${currentUser.role})
            <button class="logout-btn" onclick="logout()">Logout</button>`;
        document.getElementById('userInfo').innerHTML = info;
        document.getElementById('userInfo2').innerHTML = info;
        document.getElementById('userInfo3').innerHTML = info;
    }

function logout() {
    currentUser = null;

    // ✅ Register aur Login tabs WAPAS SHOW karo
    document.querySelectorAll('.tab-btn').forEach(btn => {
        if (btn.textContent.trim() === 'Register' ||
            btn.textContent.trim() === 'Login') {
            btn.style.display = 'block';
        }
    });

    // ✅ Baki sab tabs HIDE karo
    document.getElementById('createTab').style.display = 'none';
    document.getElementById('myTab').style.display = 'none';

    // Ye tabs hain toh hide karo
    const allTab = document.getElementById('allComplaintsTab');
    const adminTab = document.getElementById('adminTab');
    if (allTab) allTab.style.display = 'none';
    if (adminTab) adminTab.style.display = 'none';

    // ✅ Login tab par le jao
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.textContent.trim() === 'Login') {
            btn.classList.add('active');
        }
    });

    document.querySelectorAll('.tab-content').forEach(tab => {
        tab.classList.remove('active');
    });
    document.getElementById('login').classList.add('active');
}
</script>
</body>
</html>
